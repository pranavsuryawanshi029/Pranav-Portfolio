<!DOCTYPE html>
<html>
<head>
    <title>Sales Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<select id="category">
    <option>All</option>
    <option>Electronics</option>
    <option>Clothing</option>
</select>

<select id="month">
    <option>All</option>
    <option>Jan</option>
    <option>Feb</option>
    <option>Mar</option>
</select>

<select id="region">
    <option>All</option>
    <option>North</option>
    <option>South</option>
</select>

<p id="stats"></p>
<canvas id="chart" width="500" height="250"></canvas>

<script>
const $ = id => document.getElementById(id);

const sales = [
    { category: "Electronics", month: "Jan", region: "North", amount: 1200 },
    { category: "Electronics", month: "Feb", region: "South", amount: 900 },
    { category: "Clothing", month: "Jan", region: "South", amount: 400 },
    { category: "Clothing", month: "Mar", region: "North", amount: 700 },
    { category: "Electronics", month: "Mar", region: "North", amount: 1500 },
    { category: "Clothing", month: "Feb", region: "North", amount: 300 }
];

let chart;

function update() {
    const rows = sales.filter(s =>
        ($("category").value === "All" ||
            s.category === $("category").value) &&
        ($("month").value === "All" ||
            s.month === $("month").value) &&
        ($("region").value === "All" ||
            s.region === $("region").value)
    );

    const total = rows.reduce((sum, r) => sum + r.amount, 0);
    const avg = rows.length ? (total / rows.length).toFixed(2) : 0;

    $("stats").textContent =
        `Records: ${rows.length} | Total: ${total} | Average: ${avg}`;

    const byMonth = {};

    rows.forEach(r =>
        byMonth[r.month] = (byMonth[r.month] || 0) + r.amount
    );

    if (chart) chart.destroy();

    chart = new Chart($("chart"), {
        type: "bar",
        data: {
            labels: Object.keys(byMonth),
            datasets: [{
                label: "Sales by month",
                data: Object.values(byMonth)
            }]
        }
    });
}

["category", "month", "region"].forEach(id =>
    $(id).addEventListener("change", update)
);

update();

</script>
</body>
</html>
