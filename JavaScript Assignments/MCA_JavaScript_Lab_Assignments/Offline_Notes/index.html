<!DOCTYPE html>
<html>
<head>
    <title>Offline Notes</title>
</head>
<body>

<input id="title" placeholder="Title">
<input id="category" placeholder="Category">
<textarea id="body" placeholder="Write note"></textarea>

<button id="save">Save</button>

<input id="search" placeholder="Search notes">
<div id="notes"></div>

<script>
const $ = id => document.getElementById(id);

let notes = JSON.parse(localStorage.getItem("notes")) || [];
let editingId = null;

function persist() {
    localStorage.setItem("notes", JSON.stringify(notes));
}

function clearForm() {
    $("title").value = "";
    $("category").value = "";
    $("body").value = "";
    editingId = null;
}

function render() {
    const term = $("search").value.toLowerCase();

    $("notes").innerHTML = notes
        .filter(n => (n.title + n.category + n.body)
        .toLowerCase().includes(term))
        .map(n => `
            <div>
                <h4>${n.title} (${n.category})</h4>
                <p>${n.body}</p>
                <button onclick="editNote(${n.id})">Edit</button>
                <button onclick="deleteNote(${n.id})">Delete</button>
            </div>
        `).join("");
}

function editNote(id) {
    const n = notes.find(n => n.id === id);

    $("title").value = n.title;
    $("category").value = n.category;
    $("body").value = n.body;

    editingId = id;
}

function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);
    persist();
    render();
}

$("save").addEventListener("click", () => {
    const note = {
        id: editingId ?? Date.now(),
        title: $("title").value,
        category: $("category").value,
        body: $("body").value
    };

    notes = editingId
        ? notes.map(n => n.id === editingId ? note : n)
        : [...notes, note];

    persist();
    clearForm();
    render();
});

$("search").addEventListener("input", render);

if ("serviceWorker" in navigator)
    navigator.serviceWorker.register("sw.js");

render();
</script>

</body>
</html>
